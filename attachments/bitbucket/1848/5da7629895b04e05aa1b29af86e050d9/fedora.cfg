# Fedora
#
# Yum install command line needed to make this work:
#
# yum -y install mpich2 mpich2-devel \
#   gsl gsl-devel hdf5 hdf5-devel \
#   gcc gcc-c++ gcc-gfortran patch \
#   subversion libjpeg-devel hdf5-mpich-devel \
#   git openssl-devel lapack-static

# Whenever this version string changes, the application is configured 
# and rebuilt from scratch 
VERSION = 2015-12-14

CPP = cpp
FPP = cpp
CC  = gcc
CXX = g++
F77 = gfortran
F90 = gfortran
#CUCC = nvcc

CUCC_EXTRA_FLAGS = --compiler-bindir=/home/sbrandt/install/gnu-cc-4.5.3/bin
CUDA_ARCH = sm_20
CUDA_DIR = /usr/local/cuda
CUDA_LIBS     = cuda cudart iberty
CUDA_LIB_DIRS = /usr/lib64/nvidia-304xx /usr/local/cuda/lib64 /usr/lib64/nvidia  /usr/lib64
REAL_PRECISION = 8

CPPFLAGS = -DMPICH_IGNORE_CXX_SEEK 
FPPFLAGS = -traditional
# no -msse3
CFLAGS   = -fprofile-arcs -ftest-coverage -fno-inline -g3 -m128bit-long-double -march=x86-64 -std=gnu99 -rdynamic -Wunused-variable 
CXXFLAGS = -fprofile-arcs -ftest-coverage -fno-inline -g3 -m128bit-long-double -march=x86-64 -std=c++0x -rdynamic -Wunused-variable -fno-inline
F77FLAGS = -fprofile-arcs -ftest-coverage -g3 -m128bit-long-double -march=x86-64 -fcray-pointer -ffixed-line-length-none
F90FLAGS = -fprofile-arcs -ftest-coverage -g3 -m128bit-long-double -march=x86-64 -fcray-pointer -ffixed-line-length-none
LDFLAGS  = -lcrypto -fprofile-arcs -ftest-coverage 

LIBS = numa gfortran

LIBDIRS =  

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

# -check-uninit fails for asm output operands
DEBUG           = no
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS   = -O0 
CXX_DEBUG_FLAGS = -O0 
F77_DEBUG_FLAGS = -O0 -ffixed-line-length-none
F90_DEBUG_FLAGS = -O0 -ffree-line-length-none

# On Abe, the options -O3, -xT, and -ip lead to segmentation faults
# near MPI calls
# With Intel 9, using -ip prevents debug information for local variables
# With Intel 9, using -O3 leads to very long compile times (> 45 minutes)
OPTIMISE           = yes
CPP_OPTIMISE_FLAGS = -DKRANC_VECTORS -DCARPET_OPTIMISE 
FPP_OPTIMISE_FLAGS = -DCARPET_OPTIMISE 
C_OPTIMISE_FLAGS   = -O2
CXX_OPTIMISE_FLAGS = -O2
F77_OPTIMISE_FLAGS = -O2
F90_OPTIMISE_FLAGS = -O2

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F77_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

OPENMP           = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS   = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
F77_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp

WARN           = yes
CPP_WARN_FLAGS = 
FPP_WARN_FLAGS = 
C_WARN_FLAGS   = 
CXX_WARN_FLAGS = 
F77_WARN_FLAGS = 
F90_WARN_FLAGS = 

#MPI = CUSTOM
MPI_DIR      = /usr/lib64/mpich
#MPI_DIR =
#MPI_DIR = /usr/lib64/mpich
#MPI_INC_DIRS = /usr/include/mpich-x86_64
#MPI_LIB_DIRS = /usr/lib64/mpich/lib
#MPI_LIBS     = rt mpichf90 mpl opa pthread mpich mpichcxx numa
#MPI_DIR = BUILD
#MPI_INSTALL_DIR = /etc
#MPI_INSTALL_DIR = /tmp
#CACTUS_EXT_INSTALL_DIR = /home/sbrandt/install

PTHREADS = yes

GSL_DIR=/usr
LIBJPEG_DIR=/usr
HDF5_DIR=/usr
#HDF5_INSTALL_DIR=/home/sbrandt/install/hdf5
ZLIB_DIR=/usr
HWLOC_DIR=BUILD
LAPACK_DIR=/usr/lib64
PIRAHA_JAR=BUILD
CAKERNEL_JAR=BUILD
H5PUBCONF=/usr/include/mpich-x86_64/H5pubconf.h
