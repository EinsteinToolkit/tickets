# This machine description file is used internally by simfactory as a template
# during the sim setup and sim setup-silent commands
# Edit at your own risk
# Machine description
nickname        = bridges2
name            = Bridges2
location        = PSC
description     = HPC Supercomputer
webpage		= https://www.psc.edu/resources/bridges-2/user-guide-2/
status          = production

# Access to this machine
hostname        = bridges2.psc.edu
aliaspattern    = ^bridges2-login\d\d\d\.psc.edu$
envsetup	= <<EOT
    module load gcc/10.2.0
    module load openmpi/3.1.6-gcc10.2.0
    module load fftw/3.3.8
    module load hdf5/1.10.7-gcc10.2.0
EOT


# Source tree management
sourcebasedir   = /ocean/projects/tra210033p/babiuc
optionlist      = bridges2.cfg
submitscript    = bridges2.sub
runscript       = bridges2.run
make            = make -j@MAKEJOBS@
disabled-thorns = <<EOT
    ExternalLibraries/BLAS
    ExternalLibraries/LAPACK
    ExternalLibraries/OpenSSL
    ExternalLibraries/PAPI
EOT
enabled-thorns = <<EOT
    ExternalLibraries/OpenBLAS
EOT

# Simulation management
basedir         = /ocean/projects/tra210033p/babiuc/simulations
ppn             = 128
max-num-threads = 128
num-threads     = 64
nodes           = 1
queue		= RM
submit          = sbatch @SCRIPTFILE@
getstatus       = squeue -j @JOB_ID@

# need to kill the whole set of processes descending from @JOB_ID@, not just the
# (simfactory) top-level process
stop            = scancel @JOB_ID@
submitpattern   = (.*)
statuspattern   = "^ *@JOB_ID@ "
queuedpattern   = $^
runningpattern  = ^
holdingpattern  = $^
exechost        = echo localhost
exechostpattern = (.*)
stdout          = cat @SIMULATION_NAME@.out
stderr          = cat @SIMULATION_NAME@.err
stdout-follow   = tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err
