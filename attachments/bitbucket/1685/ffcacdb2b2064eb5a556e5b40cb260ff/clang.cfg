# Fedora
#
# Yum install command line needed to make this work:
#
# yum -y install mpich2 mpich2-devel \
#   gsl gsl-devel hdf5 hdf5-devel \
#   gcc gcc-c++ gcc-gfortran patch \
#   java-1.6.0-openjdk subversion \
#   git openssl-devel

# Whenever this version string changes, the application is configured 
# and rebuilt from scratch 
VERSION = 2011-02-21

CPP = cpp
FPP = cpp
CC  = clang
CXX = clang
F77 = gfortran
F90 = gfortran
CUCC = nvcc

CUDA_ARCH = sm_20
CUDA_DIR = /usr/local/cuda
CUDA_LIBS     = cuda cudart iberty
CUDA_LIB_DIRS = /usr/local/cuda/lib64 /usr/lib64/nvidia  /usr/lib64
REAL_PRECISION = 8

CPPFLAGS = -DMPICH_IGNORE_CXX_SEEK
FPPFLAGS = -traditional
# no -msse3
CFLAGS   = -g3 -march=x86-64 -fsanitize=undefined-trap -fsanitize=address
CXXFLAGS = -g3 -march=x86-64 -fsanitize=undefined-trap -fsanitize=address
F77FLAGS = -g3 -march=x86-64 -fcray-pointer -ffixed-line-length-none
F90FLAGS = -g3 -march=x86-64 -fcray-pointer -ffixed-line-length-none
LDFLAGS  = -lstdc++

LIBDIRS =  

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

# -check-uninit fails for asm output operands
DEBUG           = no
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS   = -O0 
CXX_DEBUG_FLAGS = -O0 
F77_DEBUG_FLAGS = -O0 -ffixed-line-length-none
F90_DEBUG_FLAGS = -O0 -ffree-line-length-none

# On Abe, the options -O3, -xT, and -ip lead to segmentation faults
# near MPI calls
# With Intel 9, using -ip prevents debug information for local variables
# With Intel 9, using -O3 leads to very long compile times (> 45 minutes)
OPTIMISE           = yes
CPP_OPTIMISE_FLAGS = -DKRANC_VECTORS # -DCARPET_OPTIMISE -DNDEBUG
FPP_OPTIMISE_FLAGS = # -DCARPET_OPTIMISE -DNDEBUG
C_OPTIMISE_FLAGS   = -O2
CXX_OPTIMISE_FLAGS = -O2
F77_OPTIMISE_FLAGS = -O2
F90_OPTIMISE_FLAGS = -O2

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F77_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

OPENMP           = no
CPP_OPENMP_FLAGS = 
FPP_OPENMP_FLAGS = 
C_OPENMP_FLAGS   = 
CXX_OPENMP_FLAGS = 
F77_OPENMP_FLAGS = 
F90_OPENMP_FLAGS = 

WARN           = yes
CPP_WARN_FLAGS = 
FPP_WARN_FLAGS = 
C_WARN_FLAGS   = 
CXX_WARN_FLAGS = 
F77_WARN_FLAGS = 
F90_WARN_FLAGS = 

MPI_DIR      =  /usr/lib64/mpich2
MPI_INC_DIRS = /usr/include/mpich-x86_64
MPI_LIB_DIRS = /usr/lib64/mpich/lib
MPI_LIBS     = mpich opa pthread rt

PTHREADS = yes

GSL_DIR=/usr
LIBJPEG_DIR=/usr
HDF5_DIR=/usr
ZLIB_DIR=/usr
HWLOC=BUILD
LAPACK_DIR=/usr
