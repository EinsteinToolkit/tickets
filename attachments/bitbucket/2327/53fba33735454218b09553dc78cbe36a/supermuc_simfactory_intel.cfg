# Whenever this version string changes, the application is configured
# and rebuilt from scratch
VERSION = supermuc_ng_intel-2020-01-24
####################################################

####################################################
## Load the following modules (mpi.intel is loaded by default on SuperMUC-NG)
####################################################
## module load gcc/9
## module load libszip/2.1.1
## module load numactl/2.0.11 
## module load hdf5/1.10.2-intel-impi-threadsafe
## module load gsl/2.5-intel
## module load hwloc/2.0.1
## module load papi/5.7.0
## module load fftw/3.3.8-intel
## module load libjpeg-turbo/1.5.90
## and the following are optional
## module load gnuplot/5.2.6-X11
