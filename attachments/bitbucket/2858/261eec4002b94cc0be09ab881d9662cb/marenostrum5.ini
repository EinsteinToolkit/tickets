[marenostrum5]

# Machine description
nickname        = marenostrum5
name            = Marenostrum5
location        = BSC
description     = our hope
status          = experimental

# Access to this machine
hostname        = glogin2.bsc.es
rsynccmd	= /usr/bin/rsync
aliaspattern	= ^glogin2.bsc.es$

envsetup = <<EOT
###export LIBRARY_PATH="${LIBRARY_PATH+$LIBRARY_PATH:}/usr/local/lib64:/usr/local/lib:/usr/lib64:/usr/lib:/lib64:/lib"
###export CPATH="${CPATH+$CPATH:}/usr/local/include:/usr/include:/include"
   unset MPI
EOT


# Source tree management
sourcebasedir   = /home/uib/uib416720/ETK2024/CarSpX_CPU/Cactus
user 		= uib16720
email		= ar.p-gonzalez@uib.es
optionlist      = marenostrum5.cfg
submitscript    = marenostrum5.sub
runscript       = marenostrum5.run
make            = make -j8
basedir         = /gpfs/scratch/ice70/alejandra
ppn             = 80
max-num-threads = 100
num-threads     = 2

nodes           = 8
memory		= 400

allocation	= ice70
queue		= gp_debug

submit          = sbatch @SCRIPTFILE@; sleep 5
getstatus       = squeue -j  @JOB_ID@

# need to kill the whole set of processes descending from @JOB_ID@, not just the
# (simfactory) top-level process
stop            = scancel @JOB_ID@
submitpattern   = Job (.*) is submitted
statuspattern   = '@JOB_ID@'
queuedpattern   = ' PD '
runningpattern  = ' (CF|CG|R|TO) '
holdingpattern  = ' S '

stdout          = cat @SIMULATION_NAME@.out
stderr          = cat @SIMULATION_NAME@.err
stdout-follow   = tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err
