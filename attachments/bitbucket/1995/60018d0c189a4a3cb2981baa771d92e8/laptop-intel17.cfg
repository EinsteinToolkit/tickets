# einstein-laptop-optimise

CPP = cpp
FPP = cpp
CC  = /opt/intel/compilers_and_libraries_2017.3.191/linux/bin/intel64/icc
CXX = /opt/intel/compilers_and_libraries_2017.3.191/linux/bin/intel64/icpc
F77 = /opt/intel/compilers_and_libraries_2017.3.191/linux/bin/intel64/ifort
F90 = /opt/intel/compilers_and_libraries_2017.3.191/linux/bin/intel64/ifort

#CPPFLAGS = -DMPICH_IGNORE_CXX_SEEK -DCARPET_OPTIMISE -DNDEBUG
CPPFLAGS = -DMPICH_IGNORE_CXX_SEEK -DCARPET_OPTIMISE
#FPPFLAGS = -traditional -DCARPET_OPTIMISE -DNDEBUG
FPPFLAGS = -traditional -DCARPET_OPTIMISE

# no -msse3
CFLAGS      = -align -std=c99 -U__STRICT_ANSI__ -g 
CXXFLAGS    = -align -std=c++0x -restrict -g
#-D__builtin_isnan=::isnan -g
F77FLAGS = -warn nousage -align -pad -g
F90FLAGS = -warn nousage -align -pad -g

#LIBDIRS = /opt/intel/fc/9.1.037/lib
LIBDIRS = /opt/intel/compilers_and_libraries_2017.3.191/linux/compiler/lib/intel64
LIBDIRS = /opt/intel/compilers_and_libraries_2017.3.191/linux/compiler/lib/intel64

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

DEBUG           = no
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS   = -O0 -fp -fpstkchk -ftrapuv
CXX_DEBUG_FLAGS = -O0 -fp -fpstkchk -ftrapuv
F77_DEBUG_FLAGS = -O0 -fp -fpstkchk -ftrapuv -check bounds -check overflow -check format
F90_DEBUG_FLAGS = -O0 -fp -fpstkchk -ftrapuv -check bounds -check overflow -check format

# using -ip prevents debug information for local variables
OPTIMISE           = yes
C_OPTIMISE_FLAGS   = -O2 -xHOST -ip -qopt-report -qopt-report-phase=vec,openmp
CXX_OPTIMISE_FLAGS = -O2 -xHOST -ip -qopt-report -qopt-report-phase=vec,openmp
F77_OPTIMISE_FLAGS = -O2 -xHOST -ip -qopt-report -qopt-report-phase=vec,openmp
F90_OPTIMISE_FLAGS = -O2 -xHOST -ip -qopt-report -qopt-report-phase=vec,openmp

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F77_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

OPENMP           = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS   = -qopenmp
CXX_OPENMP_FLAGS = -qopenmp
F77_OPENMP_FLAGS = -qopenmp
F90_OPENMP_FLAGS = -qopenmp

WARN           = yes
CPP_WARN_FLAGS = 
FPP_WARN_FLAGS = 
C_WARN_FLAGS   = 
CXX_WARN_FLAGS = 
F77_WARN_FLAGS = 
F90_WARN_FLAGS = 


HDF5_DIR = /usr/local/packages/hdf5-1.8.15-intel
#HDF5_LIBS = hdf5
#HDF5_LIB_DIR = /usr/local/packages/hdf5-1.8.15-intel/lib
#HDF5_INCLUDE_DIR = /usr/local/packages/hdf5-1.8.15-intel/include
#LIBSZ_DIR = /usr/local/packages/szip-2.0-intel9.1.043/lib
#LIBZ_DIR = /usr/lib64

FFTW3_DIR = /usr/local/packages/fftw-3.3.3-intel
FFTW3_LIBS = fftw3 fftw3_omp

#BLAS      = yes
#BLAS_DIR  = /opt/intel/lib/em64t
BLAS_DIR  = /opt/intel/mkl/lib/intel64
BLAS_LIBS = -Bstatic mkl_intel_lp64 mkl_core mkl_intel_thread mkl_core -Bdynamic

#LAPACK      = yes
#LAPACK_DIR  = /opt/intel/lib/em64t
LAPACK_DIR  = /opt/intel/mkl/lib/intel64
LAPACK_LIBS = -Bstatic mkl_intel_lp64 mkl_core mkl_intel_thread mkl_core -Bdynamic

MPI_DIR = NO_BUILD
#MPI = CUSTOM
MPI_LIB_DIRS = /usr/local/packages/openmpi-1.4.5-intel/lib
MPI_INC_DIRS = /usr/local/packages/openmpi-1.4.5-intel/include
MPI_LIBS = mpi open-pal open-rte

#GSL = yes
GSL_DIR = /usr
GSL_LIB_DIR = /usr/lib64
GSL_INCLUDE_DIR = /usr/include/gsl

PAPI_DIR = /usr/local/packages/papi-5.1.0-intel
#PAPI_DIR = /usr/local/packages/papi-5.1.0-gnu
PAPI_LIBS = papi

# PETSc requires mvapich2
#PETSC_DIR       = /usr/local/packages/petsc-2.3.3-intel9.1-mvapich
#PETSC_ARCH      = linux-64
#PETSC_ARCH_LIBS = X11

OPENSSL_DIR = NO_BUILD
OPENSSL_LIB_DIR = /usr/lib64
OPENSSL_INCLUDE_DIR = /usr/include
#PTHREADS = yes

