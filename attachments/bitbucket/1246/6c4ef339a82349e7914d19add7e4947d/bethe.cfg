# Whenever this version string changes, the application is configured
# and rebuilt from scratch
VERSION = bethe-2012-07-10

# last-tested-on: 2012-12-18
# last-tested-by: Erik Schnetter <schnetter@gmail.com>

CPP = cpp
FPP = cpp
CC  = /usr/local/apps/intel/intel_cc_11_1/bin/intel64/icc
CXX = /usr/local/apps/intel/intel_cc_11_1/bin/intel64/icpc
F77 = /usr/local/apps/intel/intel_fc_11_1/bin/intel64/ifort
F90 = /usr/local/apps/intel/intel_fc_11_1/bin/intel64/ifort

CPPFLAGS = -DCCTK_DISABLE_OMP_COLLAPSE -DMPICH_IGNORE_CXX_SEEK
FPPFLAGS = -DCCTK_DISABLE_OMP_COLLAPSE -traditional
CFLAGS   = -g -traceback -debug all -xSSE4.2 -align -std=c99 -ansi_alias -U__STRICT_ANSI__
CXXFLAGS = -g -traceback -debug all -xSSE4.2 -align -std=c99 -restrict -D__builtin_signbit=::signbit -D_intel_fast_memcpy=memcpy -D_intel_fast_memset=memset
F77FLAGS = -g -traceback -debug all -xSSE4.2 -align -pad -w95 -cm
F90FLAGS = -g -traceback -debug all -xSSE4.2 -align -pad -w95 -cm

CUCC                = /usr/local/apps/intel/intel_cc_11_1/bin/intel64/icpc
CUCCFLAGS           = -x c++ -DMPICH_IGNORE_CXX_SEEK -g -traceback -debug all -xSSE4.2 -align -std=c99 -restrict -openmp
CUCC_DEBUG_FLAGS    = -DCARPET_DEBUG -O0
CUCC_OPTIMISE_FLAGS = -O2
CUCC_WARN_FLAGS     =

CU_DEPEND = /usr/local/apps/intel/intel_cc_11_1/bin/intel64/icpc -M -x c++ -DMPICH_IGNORE_CXX_SEEK -openmp

LDFLAGS = -rdynamic -L/usr/local/apps/intel/intel_fc_11_1/lib/intel64 -Wl,-rpath,/usr/local/apps/intel/intel_cc_11_1/lib/intel64 -Wl,-rpath,/usr/local/apps/intel/intel_fc_11_1/lib/intel64 -Wl,-rpath,/usr/local/apps/intel/intel_cc_11_1/mkl/lib/em64t   -lifcore

VECTORISE                = yes
VECTORISE_ALIGNED_ARRAYS = no
VECTORISE_INLINE         = no

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

# -check-uninit fails for asm output operands
DEBUG           = no
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS   = -O0 # -check-uninit
CXX_DEBUG_FLAGS = -O0 # -check-uninit
F77_DEBUG_FLAGS = -O0 -check bounds -check format # -check all
F90_DEBUG_FLAGS = -O0 -check bounds -check format # -check all

OPTIMISE           = yes
CPP_OPTIMISE_FLAGS = #-DCARPET_OPTIMISE -DNDEBUG
FPP_OPTIMISE_FLAGS = #-DCARPET_OPTIMISE -DNDEBUG
C_OPTIMISE_FLAGS   = -O2 -override-limits
CXX_OPTIMISE_FLAGS = -O2 -override-limits
F77_OPTIMISE_FLAGS = -O2 -override-limits
F90_OPTIMISE_FLAGS = -O2 -override-limits

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F77_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

OPENMP           = yes
CPP_OPENMP_FLAGS = -openmp
FPP_OPENMP_FLAGS = -fopenmp
C_OPENMP_FLAGS   = -openmp
CXX_OPENMP_FLAGS = -openmp
F77_OPENMP_FLAGS = -openmp
F90_OPENMP_FLAGS = -openmp

WARN           = yes
CPP_WARN_FLAGS = 
FPP_WARN_FLAGS = 
C_WARN_FLAGS   = 
CXX_WARN_FLAGS = 
F77_WARN_FLAGS = 
F90_WARN_FLAGS = 



# With OpenMP, certain Intel libraries need to be linked statically.
# This prevents the error
# "cannot allocate memory for thread-local data: ABORT".
# However, the MPI libraries must be linked dynamically.

BLAS_DIR  = /usr/local/apps/intel/intel_cc_11_1/mkl/lib/em64t
BLAS_LIBS = mkl_intel_lp64 mkl_blas95_lp64 mkl_core guide mkl_sequential pthread ifport

#FFTW3_DIR = /usr/local/packages/fftw-3.1.2-intel10.1

GSL_DIR = /usr/local/apps/gsl-1.13-intel-intel_11.1

HDF5_DIR = /usr/local/apps/hdf5-1.8.3-intel_11.1

LAPACK_DIR  = /usr/local/apps/intel/intel_cc_11_1/mkl/lib/em64t
LAPACK_LIBS = mkl_lapack95_lp64 mkl_core  ifport

MPI_DIR  = /usr/local/apps/mpich2-1.2-intel_11.1
MPI_LIBS = mpich 

PETSC_DIR                = BUILD
PETSC_MPI_EXTRA_LIB_DIRS = /usr/lib
PETSC_MPI_EXTRA_LIBS     = pthread

PTHREADS = yes
